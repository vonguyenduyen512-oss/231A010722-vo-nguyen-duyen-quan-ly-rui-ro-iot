# Cấu hình MQTT broker (Mosquitto) của mô hình IoT giả lập được khảo sát
# trong đề tài — minh hoạ cấu hình gốc (chưa khắc phục) dùng để phân tích
# rủi ro R-07 (mục 6.2 báo cáo): "Giao thức MQTT không xác thực và không mã hóa".
# Đây KHÔNG phải cấu hình khuyến nghị — chỉ dùng làm bằng chứng khảo sát.

listener 1883
protocol mqtt

# Lỗ hổng khảo sát: cho phép kết nối ẩn danh, không yêu cầu xác thực
allow_anonymous true

# Lỗ hổng khảo sát: không bật TLS/mã hóa cho kênh truyền
# (khuyến nghị khắc phục tại Bảng 6.4: bật listener 8883 + certfile/keyfile)

persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log
